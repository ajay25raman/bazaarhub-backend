# ==============================================================================
# BazaarHub Backend - Test Profile Configuration
# ==============================================================================

spring.application.name=bazaarhub-backend-test
server.port=0

# Actuator Configuration for Test Environment
management.endpoints.web.exposure.include=health,info

# Logging Configuration
logging.level.com.bazaarhub.backend=INFO
logging.level.org.springframework.test=INFO

# ------------------------------------------------------------------------------
# In-Memory Test Database Isolation (H2 MariaDB Mode)
# ------------------------------------------------------------------------------
# Tests run entirely in-memory to prevent inserting, modifying, or deleting
# any production database records during automated test execution.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:bazaarhub_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
