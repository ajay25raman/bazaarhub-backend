# ==============================================================================
# BazaarHub Backend - Production Profile Configuration
# ==============================================================================

spring.application.name=bazaarhub-backend
server.port=8080

# Actuator Security: minimal exposure, never show health details in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Strictly disable SQL and parameter logging in production
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.com.bazaarhub.backend=INFO
logging.level.org.springframework.web=WARN

# ------------------------------------------------------------------------------
# Swagger UI Security: disabled by default in production
# ------------------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:false}

