# ==============================================================================
# BazaarHub Backend - Core Application Configuration
# ==============================================================================

spring.application.name=bazaarhub-backend
server.port=8080

# ------------------------------------------------------------------------------
# Spring Boot Actuator Endpoints
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ------------------------------------------------------------------------------
# MariaDB Database Configuration (Hostinger Shared Hosting)
# ------------------------------------------------------------------------------
# Database Host, Port, Name, Username and Password configuration
# Sensitive credentials must be injected via environment variables.
DB_HOST=srv664.hstgr.io
DB_PORT=3306
DB_NAME=u205680228_bazaarhub_db
DB_USERNAME=u205680228_bazaarhub

# Spring Datasource Configuration
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${DB_HOST:srv664.hstgr.io}:${DB_PORT:3306}/${DB_NAME:u205680228_bazaarhub_db}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:u205680228_bazaarhub}
spring.datasource.password=${DB_PASSWORD:Bazaar@Hub25}

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=BazaarHubHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# Validate existing schema without modifying tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
