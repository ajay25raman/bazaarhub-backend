# BazaarHub Backend - Development Profile Configuration
# Phase 1: Modular Monolith Foundation (Database not configured)

spring.application.name=bazaarhub-backend
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.bazaarhub.backend=DEBUG
logging.level.org.springframework.web=INFO
